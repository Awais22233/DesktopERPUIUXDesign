name: Build and test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # Tests run inside Electron's runtime, so they use the exact native SQLite binary that ships.
      - run: pnpm test
      - run: pnpm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: wholesale-erp-installer
          path: release/*.exe
          if-no-files-found: error
