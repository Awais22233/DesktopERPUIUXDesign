name: Release

# Publishes the installer. The download page links to the latest release.
on:
  push:
    tags: ["v*"]
  # Or run it by hand: Actions > Release > Run workflow, and type the version, e.g. v0.1.0.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run pack:win
      - name: Publish installer and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $exe = "release/Wholesale-ERP-Setup.exe"
          if (-not (Test-Path $exe)) { throw "Installer not found: $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Wholesale-ERP-Setup.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --title $env:TAG --target "${{ github.sha }}" --generate-notes }
          gh release upload $env:TAG $exe SHA256SUMS.txt --clobber
